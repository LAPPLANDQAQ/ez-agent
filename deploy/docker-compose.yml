services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://research:research_dev_pwd@db:5432/research
      REDIS_URL: redis://redis:6379/0
      API_PORT: 8000
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    environment:
      EZ_AGENT_API_BASE_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "8501:8501"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: research
      POSTGRES_USER: research
      POSTGRES_PASSWORD: research_dev_pwd
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  postgres_data:
